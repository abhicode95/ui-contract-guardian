name: UI Contract Guardian

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  contract-check:
    name: Check UI Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check UI contracts
        run: npx tsx packages/cli/src/index.ts check